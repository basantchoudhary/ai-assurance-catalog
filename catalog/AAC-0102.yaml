core: true

title: |-
  Cost regression is gated at release

statement: |-
  Cost per successful task for the release candidate is compared against the incumbent on the same frozen set, and a material increase blocks promotion on the same footing as a quality regression. Quality is routinely gated while cost is merely reported, so a change that buys a small quality gain for a large spend increase ships unopposed and is discovered on the invoice.

