core: true

title: |-
  The system prompt is not a security boundary

statement: |-
  Extraction of system instructions is attempted adversarially, and separately, no capability or secret depends on those instructions staying hidden. Both halves are required: the prompt will eventually leak, so a system whose access control, credentials or tool restrictions live only in prompt text is compromised by disclosure alone, and testing extraction without fixing that dependency measures the wrong thing.

