title: |-
  Guardrail enforcement fails closed

statement: |-
  When a guardrail, classifier or content filter is unavailable, times out or errors, the request fails closed or degrades to a defined safe path. Tested by taking the guardrail down under load. Fail-open is the default in most deployments and it is how a safety control silently stops existing — the dashboard still shows it configured while nothing is being checked.

