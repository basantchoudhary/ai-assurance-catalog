core: true

title: |-
  Logged prompts and responses are redacted and retention-bounded

statement: |-
  Personal data is removed from prompts and completions before persistence, retention is bounded, and the redaction is itself tested against payloads known to contain it. This obligation stands in direct tension with the trace-completeness obligation, and both hold: the resolution is redaction at write time plus bounded retention, never a choice between observability and privacy.

# Realization is advisory: it names the class of machinery that can discharge
# the obligation, never a product. See docs/REALIZATION.md.
mechanisms:
  - M1
stages:
  - S2
  - S4
tool_class: |-
  Gateway + tracing backend

