title: |-
  The output contract holds on every route

statement: |-
  Schema conformance, instruction adherence, persona and refusal scope are verified per reachable model rather than once against the primary. Structured-output reliability and instruction-following vary sharply between models, so a contract that holds on one route can fail on another while every aggregate quality metric stays flat.

