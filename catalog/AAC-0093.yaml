title: |-
  Per-caller quota and spend ceilings are enforced

statement: |-
  Request, token and currency ceilings are enforced per user, tenant and credential, outside the application's own logic. Applies wherever callers are not fully trusted. Without it a single caller can exhaust the budget for everyone while cost per successful task stays healthy, because that metric averages away the caller who is the problem.

