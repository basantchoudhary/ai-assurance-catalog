title: |-
  The serving route is recorded, with its reason and its cost

statement: |-
  Which model served the request, what caused that selection — routing rule, threshold, cache hit, fallback after failure — and what it cost are all present in the trace. Recording the model alone is insufficient: without the reason, a quality regression cannot be attributed to a route, and a silent substitution during failover is indistinguishable from normal operation.

