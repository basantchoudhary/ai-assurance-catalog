core: true

title: |-
  Context growth is tracked across releases

statement: |-
  Input tokens per task are trended release over release, not just totalled. Context grows by accretion — an added instruction, another few-shot example, one more retrieved chunk — and each addition is individually defensible while the accumulated total becomes the largest controllable cost driver in the system. Nothing in a per-release diff makes that visible.

