title: |-
  Routing changes are gated like model changes

statement: |-
  A change to routing rules, escalation thresholds, cache policy or the reachable model set re-runs the release suite before promotion. Routing configuration is a production behaviour change that conventionally ships through a configuration path with none of the evaluation a model or prompt change would attract.

