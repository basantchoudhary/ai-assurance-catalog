core: true

title: |-
  Streamed output is screened before it reaches the caller

statement: |-
  Where responses are streamed, output policy applies to the stream rather than to the completed response. Tested with a payload that only violates policy in its final tokens. Applies wherever streaming is used: a filter that runs after generation cannot unsay what has already been delivered, and buffering the whole response to check it silently discards the reason streaming was chosen.

