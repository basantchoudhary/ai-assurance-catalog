core: true

title: |-
  Spend is attributable to tenant, feature and route

statement: |-
  Every unit of spend carries the dimensions needed to answer who incurred it, for which feature, on which route. Without attribution a rising bill is observable but not diagnosable, unit economics cannot be computed at all, and the first question asked after a cost incident has no answer in the data already collected.

