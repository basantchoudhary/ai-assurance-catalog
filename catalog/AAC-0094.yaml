statement: |-
  The set of models the application may call is enforced at the egress point rather than by convention, including refusal of direct provider calls that bypass it. Verified by attempting an unapproved call from application code. Every governance framework asks for an inventory of the AI systems in use; without enforcement that inventory records intent rather than fact.

