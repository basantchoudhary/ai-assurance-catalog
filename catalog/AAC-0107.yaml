title: |-
  Serving artifacts are the ones that were evaluated

statement: |-
  Model version, adapter weights, embedding model, prompt revision and third-party components are pinned by identifier or digest, and the release gate verifies that what serves traffic is what passed evaluation. Any of these substituted after evaluation invalidates every result the gate relied on, and the substitution is usually invisible because the interface does not change.

