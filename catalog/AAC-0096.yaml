title: |-
  Cached responses never cross a trust boundary

statement: |-
  Where exact or semantic response caching is used, the cache key includes every identity, tenant and permission dimension that could change the correct answer. Tested adversarially by priming the cache as one principal and requesting as another. Semantic caching makes this sharper than it looks, because near-miss matching can serve one caller's answer to a different question.

