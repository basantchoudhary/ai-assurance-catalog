title: |-
  Processing region is enforced and recorded

statement: |-
  Where residency obligations apply, the region in which inference occurs is constrained at routing time and recorded in the trace. Applies to regulated domains and to any deployment with contractual residency commitments. A fallback route that silently crosses a boundary during a regional outage is the failure mode, and it appears only under exactly the conditions nobody rehearses.

